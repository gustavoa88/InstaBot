services:

  postgres:
    image: postgres:16
    container_name: ccp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contentdb}
      POSTGRES_USER: ${POSTGRES_USER:-contentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentpass}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ccp-redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379"

  backend:
    build: ./backend
    container_name: ccp-backend
    working_dir: /app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: ./backend
    container_name: ccp-celery-worker
    working_dir: /app
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis

  celery_beat:
    build: ./backend
    container_name: ccp-celery-beat
    working_dir: /app
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: ccp-frontend
    working_dir: /app
    command: npm run dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_ADMIN_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
