services:

  postgres:
    image: postgres:16
    container_name: ccp-postgres
    restart: always
    environment:
      POSTGRES_DB: contentdb
      POSTGRES_USER: contentuser
      POSTGRES_PASSWORD: contentpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ccp-redis
    restart: always
    ports:
      - "6380:6379"

  backend:
    image: python:3.12-slim
    container_name: ccp-backend
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
